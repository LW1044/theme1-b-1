<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mealink</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main>
		<section id="select-page">
			<h1>Mealink</h1>
			<p>
				<div class="name-field">
					<label for="name-input">名前（ニックネーム）</label>
					<div class="name-field-control">
						<input id="name-input" type="text" placeholder="例：はる" required>
						<span class="name-history" hidden>
							<span aria-hidden="true">▼</span>
							<select id="saveName" aria-label="前に使った名前を選ぶ">
								<option value="">前に使った名前を選ぶ</option>
							</select>
						</span>
					</div>
				</div>
			</p>
			<button id="kids-button" type="button">作ってもらう</button>
			<button id="mom-button" type="button">作る</button>
		</section>
	</main>

	<script src="app.js"></script>
</body>
</html>
